name: CI

# The test gate the Makefile's `release` target assumes exists. Every push and
# every PR, so a tag is only ever cut from a tested main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Every row against live services is minutes, not seconds; a hung service or a
    # deadlocked test must still not sit on a runner for the default six hours.
    timeout-minutes: 45

    # Every service the backend matrix knows, addressed here, so every row runs.
    # CLAUDE.md's rule — missing infrastructure is a test failure, not a skip — is
    # only true of a run that can reach all four; a break in any of these values
    # turns the affected rows red. Azure's account and key are the emulator's
    # well-known pair, which the tests default to.
    env:
      RANKE_NEO4J_BOLT: bolt://127.0.0.1:7687
      RANKE_NEO4J_HTTP: http://127.0.0.1:7474
      RANKE_NEO4J_USER: neo4j
      RANKE_NEO4J_PASS: rankeperfpass
      RANKE_REDIS_ADDR: 127.0.0.1:6379
      RANKE_REDIS_PASS: rankeperfpass
      RANKE_S3_ENDPOINT: http://127.0.0.1:9000
      RANKE_S3_KEY: minioadmin
      RANKE_S3_SECRET: minioadmin
      RANKE_AZURE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1

    steps:
      - uses: actions/checkout@v4

      # go.mod is the single source of truth for the toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `docker run`, not a services: block: redis needs --requirepass and minio
      # needs `server /data`, and a service container cannot carry a command.
      # Started before the build so the slow one (neo4j) boots while Go compiles.
      # MinIO comes from quay.io, which is where it is published: docker.io/minio/minio
      # answers 404, and an anonymous pull of it is refused as access denied.
      - name: Start backends
        run: |
          docker run -d --name ranke-neo4j -p 7474:7474 -p 7687:7687 \
            -e NEO4J_AUTH=neo4j/rankeperfpass docker.io/library/neo4j:5
          docker run -d --name ranke-redis -p 6379:6379 \
            docker.io/library/redis:7-alpine redis-server --requirepass rankeperfpass
          docker run -d --name ranke-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data

      # Azurite from npm rather than its image: it ships as an npm package and the
      # runner has node, so the blob service starts without a registry pull, on the
      # port and version `services/azurite.sh native` uses — CI and a local run stay
      # one story rather than two.
      - name: Start Azurite
        run: |
          npm install -g azurite@3.37.0
          mkdir -p "$RUNNER_TEMP/azurite"
          nohup azurite-blob --blobHost 127.0.0.1 --blobPort 10000 \
            --location "$RUNNER_TEMP/azurite" > "$RUNNER_TEMP/azurite.log" 2>&1 &

      # The spec the rule-citation gate reads (`RANKE_SPEC`, else docs/papers/) lives
      # in ranke-graph, so it is infrastructure like the services: fetched, not
      # skipped. `make verify` fetches it too, through `docs-current`, which finds the
      # stamp this step just wrote and re-clones nothing. Kept as its own step so an
      # unreachable papers repo is named here rather than inside a gate — and named
      # in seconds, before the services are waited on.
      - name: Fetch the spec
        run: make docs

      # brokkr, the linter `make lint` runs, comes from `make tools` — the same
      # install a developer gets, so the two cannot drift. It resolves the latest
      # release itself and detects OS and arch, which is what a mac or arm runner
      # would otherwise need spelled out here.
      #
      # `make lint` depends on it, so this step exists only to name the download as
      # its own failure. CI's linter version moves without a ranke-go commit, exactly
      # as the spec bundle does: a brokkr release can turn this job red on an
      # untouched branch, and that is the intent — the gate tracks the tool.
      - name: Install brokkr
        run: make tools

      # The static gates, each a named step so a red run says which gate broke rather
      # than only that `make check/full` did. `make verify` is available to the runner
      # now that brokkr is installed above, and the Test step below runs every one of
      # these again through it; they are seconds by then, and the naming is worth it on
      # a 45-minute job.
      #
      # `go build ./...` is the one that is NOT in `make verify`: that target's `build`
      # compiles the three cmd binaries and what they import, so a package nothing
      # imports is only compiled here.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: make fmt-check

      # Needs brokkr, installed above. Here rather than only inside `make check/full`
      # so a lint failure is named, and so a broken install shows up in seconds
      # instead of after the suite has run.
      - name: Lint
        run: make lint

      # Every rule id the code cites is one the spec declares. Needs the spec above.
      - name: Rule citations
        run: make rule-citations

      # Neo4j takes tens of seconds to serve, so wait for the wire rather than the
      # container state: a slow boot must not read as a broken backend.
      - name: Wait for backends
        run: |
          # Azurite answers an unsigned listing with 403, so any status line at all
          # says it serves; -f would read that refusal as a dead service.
          azurite() {
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              "${RANKE_AZURE_ENDPOINT}?comp=list" || true)"
            [ -n "$code" ] && [ "$code" != "000" ]
          }
          serving() {
            curl -sf -o /dev/null http://127.0.0.1:7474/ &&
            curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/ready &&
            (exec 3<>/dev/tcp/127.0.0.1/6379) &&
            azurite
          }
          for _ in $(seq 60); do
            if serving; then echo "neo4j, minio, redis and azurite are serving"; exit 0; fi
            sleep 5
          done
          echo "backends did not come up within 300s" >&2
          docker ps -a
          cat "$RUNNER_TEMP/azurite.log" || true
          exit 1

      # The full gate, the same target a developer runs locally, so the two cannot
      # drift apart: every backend row required, the benchmark, the scale set, and the
      # scenario bundles with their docs. Packages run in parallel —
      # internal/exclusive holds a cross-process lock around the shared neo4j, which
      # is what -p 1 was for.
      - name: Test
        run: make check/full

      # A backend row failing reads as a conformance bug, and the service's own log is
      # what separates that from a service that died under the run.
      - name: Backend logs
        if: failure()
        run: |
          for c in ranke-neo4j ranke-redis ranke-minio; do
            echo "--- $c ---"
            docker logs --tail 50 "$c" 2>&1 || true
          done
